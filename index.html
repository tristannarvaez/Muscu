<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1322">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Cadence">
  <title>Cadence</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" href="icon-cadence-v5.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..900;1,62..125,400..900&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1><svg class="logo-h" viewBox="0 0 512 512" aria-hidden="true">
      <rect width="512" height="512" rx="112" fill="#0d1b2e"/>
      <g transform="translate(45 0) skewX(-10)">
        <path d="M370.9 159.6 A150 150 0 1 0 370.9 352.4" fill="none" stroke="#ffffff" stroke-width="58" stroke-linecap="round"/>
        <g fill="#ff5a2e">
          <rect x="358" y="250" width="76" height="12" rx="6"/>
          <rect x="346" y="234" width="14" height="44" rx="5"/>
          <rect x="432" y="234" width="14" height="44" rx="5"/>
          <rect x="330" y="214" width="16" height="84" rx="6"/>
          <rect x="446" y="214" width="16" height="84" rx="6"/>
        </g>
      </g>
    </svg>Cadence</h1>
    <button class="engrenage" data-tab="reglages" aria-label="Paramètres">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>
    </button>
  </header>

  <main id="app"></main>

  <nav class="barre" aria-label="Navigation">
    <button data-tab="seances" class="actif">
      <span class="icone"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="7" width="3" height="10" rx="1"/><rect x="16" y="7" width="3" height="10" rx="1"/><path d="M2.5 10v4M21.5 10v4M8 12h8"/></svg></span>
      <span class="libelle">Programme</span>
    </button>
    <button data-tab="journal">
      <span class="icone"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2.5"/><path d="M9 3.5h6M9 11l2 2 4-4M9 17h6"/></svg></span>
      <span class="libelle">Journal</span>
    </button>
    <button data-tab="progression">
      <span class="icone"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17l5-5 4 4 8-8"/><path d="M15 8h5v5"/></svg></span>
      <span class="libelle">Progrès</span>
    </button>
    <button data-tab="nutrition">
      <span class="icone"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19C5 10 10 5 19 5c0 9-5 14-14 14z"/><path d="M5 19l8-8"/></svg></span>
      <span class="libelle">Nutrition</span>
    </button>
    <button data-tab="cuisine">
      <span class="icone"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10h16v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5v-5z"/><path d="M2 10h20M9.5 3.5c0 1.2 1 1.3 1 2.5M13.5 3.5c0 1.2 1 1.3 1 2.5"/></svg></span>
      <span class="libelle">Cuisine</span>
    </button>
    <button data-tab="mensurations">
      <span class="icone"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="8" width="18" height="8" rx="2"/><path d="M7 8v3M11 8v4M15 8v3"/></svg></span>
      <span class="libelle">Mesures</span>
    </button>
  </nav>

  <dialog id="demo">
    <h3 id="demo-titre"></h3>
    <div id="demo-anim" class="fiche-exo"></div>
    <a id="demo-video" class="bouton principal" target="_blank" rel="noopener">Voir une vidéo de démonstration</a>
    <button id="demo-fermer" class="secondaire">Fermer</button>
  </dialog>

  <script src="exercices.js"></script>
  <script src="cuisine.js"></script>
  <script src="batch.js"></script>
  <script src="monde.js"></script>
  <script src="anatomie.js"></script>
  <script src="app.js"></script>
</body>
</html>
