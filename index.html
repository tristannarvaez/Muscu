<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Cadence">
  <title>Cadence</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" href="icon-cadence-v4.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1><svg class="logo-h" viewBox="0 0 512 512" aria-hidden="true">
      <defs>
        <linearGradient id="lc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c8ff3d"/><stop offset="1" stop-color="#8dff3d"/></linearGradient>
        <linearGradient id="lh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff6fa0"/><stop offset="1" stop-color="#ff3d7f"/></linearGradient>
      </defs>
      <rect width="512" height="512" rx="112" fill="#0f1115"/>
      <path d="M370.9 159.6 A150 150 0 1 0 370.9 352.4" fill="none" stroke="url(#lc)" stroke-width="56" stroke-linecap="round"/>
      <g fill="url(#lh)">
        <rect x="358" y="250" width="76" height="12" rx="6"/>
        <rect x="346" y="234" width="14" height="44" rx="5"/>
        <rect x="432" y="234" width="14" height="44" rx="5"/>
        <rect x="330" y="214" width="16" height="84" rx="6"/>
        <rect x="446" y="214" width="16" height="84" rx="6"/>
      </g>
    </svg>Cadence</h1>
    <button class="engrenage" data-tab="reglages" aria-label="Paramètres">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>
    </button>
  </header>

  <main id="app"></main>

  <nav class="barre">
    <button data-tab="seances" class="actif">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 7v10M18 7v10M3 9v6M21 9v6M6 12h12"/></svg>
      <span>Programme</span>
    </button>
    <button data-tab="progression">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5M4 19h16M8 15l4-4 3 3 5-6"/></svg>
      <span>Progression</span>
    </button>
    <button data-tab="journal" class="centre">
      <span class="rond">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4zM14 6l4 4"/></svg>
      </span>
      <span>Journal</span>
    </button>
    <button data-tab="nutrition">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19C5 10 10 5 19 5c0 9-5 14-14 14zM5 19l8-8"/></svg>
      <span>Nutrition</span>
    </button>
    <button data-tab="cuisine">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11h16v3a6 6 0 0 1-6 6h-4a6 6 0 0 1-6-6v-3zM2 11h2M20 11h2M9 4c0 1.5 1 1.5 1 3M13 4c0 1.5 1 1.5 1 3"/></svg>
      <span>Cuisine</span>
    </button>
    <button data-tab="mensurations">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 12l4-3"/></svg>
      <span>Mesures</span>
    </button>
  </nav>

  <dialog id="demo">
    <h3 id="demo-titre"></h3>
    <div id="demo-anim" class="demo-anim"></div>
    <p class="demo-conseil">Points clés d’exécution, puis la vidéo pour la technique complète.</p>
    <a id="demo-video" class="bouton principal" target="_blank" rel="noopener">Voir une vidéo de démonstration</a>
    <button id="demo-fermer" class="secondaire">Fermer</button>
  </dialog>

  <script src="exercices.js"></script>
  <script src="cuisine.js"></script>
  <script src="batch.js"></script>
  <script src="monde.js"></script>
  <script src="app.js"></script>
</body>
</html>
