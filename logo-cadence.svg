<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="c" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c8ff3d"/>
      <stop offset="1" stop-color="#8dff3d"/>
    </linearGradient>
  </defs>
  <!-- Fond sombre à coins arrondis, comme l'écran d'accueil d'iPhone -->
  <rect width="512" height="512" rx="112" fill="#0f1115"/>
  <!-- Lettre C : un arc épais, ouvert à droite -->
  <path d="M370.9 159.6 A150 150 0 1 0 370.9 352.4"
        fill="none" stroke="url(#c)" stroke-width="56" stroke-linecap="round"/>
  <!-- Point rose dans l'ouverture : le temps de la cadence -->
  <circle cx="392" cy="256" r="24" fill="#ff3d7f"/>
</svg>
