<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Fond marine à coins arrondis -->
  <rect width="512" height="512" rx="112" fill="#0d1b2e"/>
  <!-- Lettre et haltère légèrement inclinées, comme les titres -->
  <g transform="translate(45 0) skewX(-10)">
    <!-- Lettre C : un arc épais, ouvert à droite -->
    <path d="M370.9 159.6 A150 150 0 1 0 370.9 352.4"
          fill="none" stroke="#ffffff" stroke-width="58" stroke-linecap="round"/>
    <!-- Haltère orange effort -->
    <g fill="#ff5a2e">
      <rect x="358" y="250" width="76" height="12" rx="6"/>
      <rect x="346" y="234" width="14" height="44" rx="5"/>
      <rect x="432" y="234" width="14" height="44" rx="5"/>
      <rect x="330" y="214" width="16" height="84" rx="6"/>
      <rect x="446" y="214" width="16" height="84" rx="6"/>
    </g>
  </g>
</svg>
